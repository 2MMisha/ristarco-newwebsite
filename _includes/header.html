<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | append: page.lang | append: '/' | relative_url }}">
      {% if site.lang_dirs[page.lang] == "rtl" %}
        <img class="brand__logo" src="{{ '/assets/img/logo-RTL.svg' | relative_url }}" alt="{{ site.org.short_name }}" height="34">
      {% else %}
        <img class="brand__logo" src="{{ '/assets/img/logo-LTR.svg' | relative_url }}" alt="{{ site.org.short_name }}" height="34">
      {% endif %}
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" onclick="document.getElementById('site-nav').classList.toggle('is-open'); this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') !== 'true');">
      <span></span><span></span><span></span>
    </button>

    <nav id="site-nav" class="site-nav">
      <a href="{{ '/' | append: page.lang | append: '/' | relative_url }}">{{ site.data.ui[page.lang].nav_home }}</a>
      <a href="{{ '/' | append: page.lang | append: '/about/' | relative_url }}">{{ site.data.ui[page.lang].nav_about }}</a>
      <a href="{{ '/' | append: page.lang | append: '/events/' | relative_url }}">{{ site.data.ui[page.lang].nav_events }}</a>
      <a href="{{ '/' | append: page.lang | append: '/contact/' | relative_url }}">{{ site.data.ui[page.lang].nav_contact }}</a>
      {% include lang-switcher.html %}
    </nav>
  </div>
</header>
