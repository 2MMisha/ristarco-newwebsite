{% assign a11y = site.data.ui[page.lang].a11y %}
<div class="a11y-widget" data-a11y-widget>
  <button type="button" class="a11y-widget__toggle" aria-expanded="false" aria-controls="a11y-panel" data-a11y-toggle>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="4" r="2" fill="currentColor"/><path fill="currentColor" d="M4 8.5c-.6.1-1 .6-.9 1.2.1.6.6 1 1.2.9L10 9.5V12l-3 8.6c-.2.6.1 1.2.6 1.4.6.2 1.2-.1 1.4-.6L12 15l3 6.4c.2.5.8.8 1.4.6.5-.2.8-.8.6-1.4L14 12V9.5l5.7 1.1c.6.1 1.1-.3 1.2-.9.1-.6-.3-1.1-.9-1.2L14 7.2c-.6-.1-1.3-.2-2-.2s-1.4.1-2 .2L4 8.5z"/></svg>
    <span class="sr-only">{{ a11y.toggle_label }}</span>
  </button>

  <div id="a11y-panel" class="a11y-widget__panel" role="dialog" aria-label="{{ a11y.panel_label }}" data-a11y-panel hidden>
    <h2>{{ a11y.panel_label }}</h2>

    <div class="a11y-widget__row">
      <span>{{ a11y.font_size }}</span>
      <div class="a11y-widget__btns">
        <button type="button" data-a11y-action="font-decrease" aria-label="{{ a11y.font_decrease }}">A−</button>
        <button type="button" data-a11y-action="font-reset" aria-label="{{ a11y.font_reset }}">A</button>
        <button type="button" data-a11y-action="font-increase" aria-label="{{ a11y.font_increase }}">A+</button>
      </div>
    </div>

    <label class="a11y-widget__row a11y-widget__switch">
      <span>{{ a11y.contrast }}</span>
      <input type="checkbox" data-a11y-toggle-flag="contrast">
    </label>

    <label class="a11y-widget__row a11y-widget__switch">
      <span>{{ a11y.underline_links }}</span>
      <input type="checkbox" data-a11y-toggle-flag="underline-links">
    </label>

    <label class="a11y-widget__row a11y-widget__switch">
      <span>{{ a11y.readable_font }}</span>
      <input type="checkbox" data-a11y-toggle-flag="readable-font">
    </label>

    <label class="a11y-widget__row a11y-widget__switch">
      <span>{{ a11y.reduce_motion }}</span>
      <input type="checkbox" data-a11y-toggle-flag="motion">
    </label>

    <button type="button" class="a11y-widget__reset" data-a11y-action="reset">{{ a11y.reset }}</button>
  </div>
</div>
